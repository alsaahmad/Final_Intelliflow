# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = .

# timezone to use when rendering the date within the migration file as
# well as the filename.
# string value, for example 'UTC', 'US/Eastern', etc.
timezone = UTC

# max length of characters in file_template
# max_length = 40

# version_locations = %(here)s/bar:%(here)s/bat:alembic/versions

# version_path_separator = :
# version_path_separator = os

# set to 'true' to run the environment during
# the 'revision' command, regardless of whether
# any target metadata is specified.
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a corresponding .py file to be detected as revisions
# sourceless = false

# version generator class
# version_generator = alembic.util.RevIdGenerator

# database url string
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/intelliflow_db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
